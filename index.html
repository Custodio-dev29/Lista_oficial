<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <!-- Metadados -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
    <meta name="description" content="Lista de compras offline com total calculado e exportação em PDF/JSON.">
    <title>Lista de Compras</title>

    <!-- PWA (app instalável) -->
    <meta name="theme-color" content="#4CAF50">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Lista">
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon-180.png">

    <!-- Estilos -->
    <link rel="stylesheet" href="./css/style.css">

    <!-- Biblioteca de PDF (via CDN) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <!-- Scripts do app (defer: rodam após o HTML carregar, na ordem) -->
    <script src="./js/app.js" defer></script>
    <script src="./js/viewport.js" defer></script>
    <script src="./js/pwa.js" defer></script>
</head>
<body>

    <!-- Container único do app -->
    <div id="app">

        <!-- Cabeçalho: título, total, botão "+" e ações de exportar/importar -->
        <header>
            <div class="header-top">
                <div class="header-title">
                    <h1>Lista de Compras</h1>
                    <div class="total-container">
                        <span>Valor Total:</span>
                        <span id="total-geral">R$ 0,00</span>
                    </div>
                </div>

                <button id="btn-add-item" class="fab" aria-label="Adicionar item" title="Adicionar item">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6z"></path></svg>
                </button>
            </div>

            <div class="actions-container">
                <button id="btn-export-pdf">Exportar PDF</button>
                <button id="btn-export-json">Exportar JSON</button>
                <button id="btn-import">Importar</button>
                <input type="file" id="import-file" style="display: none;" accept=".json,.pdf">
            </div>
        </header>

        <!-- Lista de itens (preenchida pelo js/app.js) -->
        <main>
            <ul id="lista-itens">
                <!-- Itens da lista serão inseridos aqui pelo JavaScript -->
            </ul>
        </main>

    </div>

    <!-- Modal para adicionar/editar item -->
    <div id="modal-item" class="modal-overlay">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
            <div class="modal-header">
                <h2 id="modal-titulo">Adicionar Item</h2>
                <button type="button" id="btn-close-modal" class="modal-close" aria-label="Fechar">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"></path></svg>
                </button>
            </div>

            <form id="form-item">
                <input type="hidden" id="item-id">
                <div class="input-group">
                    <label for="nome-item">Nome</label>
                    <input type="text" id="nome-item" placeholder="Nome do item" required>
                </div>
                <div class="input-group-row">
                    <div class="input-group">
                        <label for="qtde-item">Qtde</label>
                        <input type="number" id="qtde-item" placeholder="1" value="1" min="1" required>
                    </div>
                    <div class="input-group">
                        <label for="preco-item">Preço Unit.</label>
                        <input type="text" id="preco-item" inputmode="decimal" autocomplete="off" placeholder="R$ 0,00" required>
                    </div>
                </div>
                <div class="input-group">
                    <label for="posicao-item">Posição na lista</label>
                    <input type="number" id="posicao-item" min="1" inputmode="numeric" placeholder="1">
                </div>
                <div class="form-actions">
                    <button type="submit" id="btn-submit">Adicionar Item</button>
                    <button type="button" id="btn-excluir-modal" class="btn-excluir-modal">Excluir</button>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
